<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Réinitialisation du mot de passe - ACC Triathlon</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .reset-container {
            max-width: 440px;
            margin: 60px auto;
            padding: 2rem;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }

        .reset-container h1 {
            font-size: 1.3rem;
            color: #2d3748;
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .reset-container input {
            width: 100%;
            padding: 0.75rem;
            margin-bottom: 1rem;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            font-size: 1rem;
        }

        .reset-container input:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .reset-container button {
            width: 100%;
        }

        .reset-info {
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            text-align: center;
        }

        .reset-info.error {
            color: #c53030;
            background: #fff5f5;
            border: 1px solid #fed7d7;
        }

        .reset-info.success {
            color: #22543d;
            background: #f0fff4;
            border: 1px solid #c6f6d5;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 1rem;
            color: var(--primary-color);
            font-size: 0.9rem;
        }
    </style>
</head>

<body>
    <main>
        <div class="reset-container">
            <h1>🔑 Réinitialisation du mot de passe</h1>

            <div id="reset-status" class="reset-info" style="display: none;"></div>

            <form id="reset-form" style="display: none;">
                <input type="password" id="new-password" placeholder="Nouveau mot de passe (min. 6 caractères)"
                    minlength="6" required>
                <input type="password" id="confirm-password" placeholder="Confirmer le mot de passe" minlength="6"
                    required>
                <button type="submit">Réinitialiser le mot de passe</button>
            </form>

            <a href="/" class="back-link">← Retour à la connexion</a>
        </div>
    </main>

    <script>
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token');
        const statusBox = document.getElementById('reset-status');
        const form = document.getElementById('reset-form');

        // Lien reçu à la création du compte par un administrateur (import)
        if (params.get('bienvenue') === '1') {
            document.title = 'Choix du mot de passe - ACC Triathlon';
            document.querySelector('.reset-container h1').textContent = '👋 Bienvenue ! Choisissez votre mot de passe';
            form.querySelector('button[type="submit"]').textContent = 'Activer mon compte';
            document.getElementById('new-password').placeholder = 'Mot de passe (min. 6 caractères)';
        }

        function showStatus(message, type) {
            statusBox.textContent = message;
            statusBox.className = 'reset-info ' + type;
            statusBox.style.display = 'block';
        }

        async function checkToken() {
            if (!token) {
                showStatus('Lien invalide : aucun token fourni.', 'error');
                return;
            }

            try {
                const response = await fetch('/api/reset-password/info/' + encodeURIComponent(token));
                if (response.ok) {
                    form.style.display = 'block';
                } else {
                    const data = await response.json();
                    showStatus(data.error || 'Lien invalide ou expiré.', 'error');
                }
            } catch (err) {
                showStatus('Erreur lors de la vérification du lien.', 'error');
            }
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const nouveauMotDePasse = document.getElementById('new-password').value;
            const confirmerMotDePasse = document.getElementById('confirm-password').value;

            if (nouveauMotDePasse !== confirmerMotDePasse) {
                showStatus('Les mots de passe ne correspondent pas.', 'error');
                return;
            }

            try {
                const response = await fetch('/api/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, nouveauMotDePasse, confirmerMotDePasse })
                });

                const data = await response.json();

                if (response.ok) {
                    form.style.display = 'none';
                    showStatus(data.message, 'success');
                } else {
                    showStatus(data.error, 'error');
                }
            } catch (err) {
                showStatus('Erreur lors de la réinitialisation.', 'error');
            }
        });

        checkToken();
    </script>
</body>

</html>
